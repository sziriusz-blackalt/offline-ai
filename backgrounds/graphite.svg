<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22262b"/>
      <stop offset=".5" stop-color="#111418"/>
      <stop offset="1" stop-color="#050708"/>
    </linearGradient>
    <radialGradient id="spot" cx="50%" cy="0%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="lines" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="28" height="28" fill="none"/>
      <path d="M0 0 V28" stroke="#ffffff" stroke-opacity=".035" stroke-width="4"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#base)"/>
  <rect width="1600" height="900" fill="url(#spot)"/>
  <rect width="1600" height="900" fill="url(#lines)"/>
  <circle cx="800" cy="420" r="330" fill="none" stroke="#3ddc97" stroke-opacity=".06" stroke-width="2"/>
  <circle cx="800" cy="420" r="480" fill="none" stroke="#3ddc97" stroke-opacity=".04" stroke-width="2"/>
</svg>
